name: Deploy blog to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-publish from the Actions tab without a new commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, and let an in-flight one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Exposes the repo's Pages URL so the build can bake in the right base path.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `next build` type-checks as part of the build and fails on TS errors, so
      # there is no separate typecheck step. A standalone `tsc` run here would fail
      # anyway: it needs next-env.d.ts, which the build is what generates.
      - name: Build static site
        env:
          # "/repo-name" for a project site, "" for username.github.io
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.origin }}
        run: npm run build

      # Without this, Pages runs the output through Jekyll, which drops _next/
      - name: Disable Jekyll
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
